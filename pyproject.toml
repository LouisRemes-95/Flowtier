[project]
name = "flowtier"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Louis Remes", email = "louisremes@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "colorcet>=3.2.1",
    "edt>=3.1.2",
    "libigl>=2.6.3",
    "mahotas>=1.4.19",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "pyside6>=6.12.0",
    "pyvista>=0.49.2",
    "pyvistaqt>=0.13.2",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "trimesh>=5.2.1",
]

[project.scripts]
flowtier = "flowtier.cli:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
