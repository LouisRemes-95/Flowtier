[project]
name = "flowtier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Louis Remes", email = "louisremes@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "libigl>=2.6.3",
    "numpy>=2.5.4",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "trimesh>=5.1.1",
]

[project.scripts]
flowtier = "flowtier:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
